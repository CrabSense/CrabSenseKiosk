name: CrabSense Kiosk CI/CD

on:
  push:
    branches: [main, DEV-Duy]
  pull_request:
    branches: [main, DEV-Duy]
  workflow_dispatch:

concurrency:
  group: kiosk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CrabSenseKiosk.csproj

      - name: Build
        run: dotnet build CrabSenseKiosk.csproj -c Release --no-restore

      - name: Publish Linux
        run: dotnet publish CrabSenseKiosk.csproj -c Release -r linux-x64 --self-contained true --no-restore -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: crabsense-kiosk-linux-x64
          path: publish

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: [self-hosted, linux, kiosk]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crabsense-kiosk-linux-x64
          path: publish

      - name: Install release and restart
        shell: bash
        run: |
          set -euo pipefail
          release="/opt/crabsense-kiosk/releases/${GITHUB_SHA}"
          previous="$(readlink -f /opt/crabsense-kiosk/current 2>/dev/null || true)"
          sudo mkdir -p /var/lib/crabsense-kiosk
          sudo chown -R korokoro:korokoro /var/lib/crabsense-kiosk
          sudo mkdir -p "$release"
          sudo cp -a publish/. "$release/"
          if [ -n "$previous" ] && [ -f "$previous/kiosk-secret.txt" ]; then
            sudo cp "$previous/kiosk-secret.txt" "$release/kiosk-secret.txt"
          fi
          sudo chmod +x "$release/CrabSenseKiosk"
          sudo chown -R korokoro:korokoro "$release"
          sudo ln -sfn "$release" /opt/crabsense-kiosk/current
          sudo systemctl restart crabsense-kiosk
          healthy=0
          for _ in {1..10}; do
            if python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=8)"; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            if [ -n "$previous" ]; then
              sudo ln -sfn "$previous" /opt/crabsense-kiosk/current
              sudo systemctl restart crabsense-kiosk
            fi
            exit 1
          fi
